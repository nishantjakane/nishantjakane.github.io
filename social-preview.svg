<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">NJ. — Nishant Jakane Portfolio</title>
  <desc id="description">A black glass card with the NJ. monogram for Nishant Jakane's portfolio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.52" stop-color="#111111"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".035"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <ellipse cx="600" cy="328" rx="295" ry="180" fill="#fff" fill-opacity=".13" filter="url(#shadow)"/>
  <rect x="285" y="110" width="630" height="410" rx="72" fill="url(#glass)" stroke="#fff" stroke-opacity=".24"/>
  <path d="M357 150c91-52 398-64 502-12" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="3" stroke-linecap="round"/>
  <text x="600" y="372" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="220" font-weight="700" letter-spacing="-16" fill="#fff">NJ.</text>
  <text x="600" y="448" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="8" fill="#fff" fill-opacity=".68">PORTFOLIO</text>
</svg>
